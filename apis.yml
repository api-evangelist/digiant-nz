aid: digiant-nz
name: digiantnz
description: >-
  digiantnz is a Christchurch, New Zealand operator that runs a2a-browser, a self-hosted, account-less, pay-per-query web
  retrieval agent published as an A2A 0.3 agent card at a2a-browser.digiant.nz. The agent exposes two skills over a JSON-RPC
  2.0 endpoint — Web Search (SERP query with LLM synthesis and entity extraction) and Page Fetch (Playwright-rendered fetch
  with a 50k-character cap) — identifies callers by an Ed25519 public key instead of a signup, runs a free FIFO tier at
  10 requests/hour, and quotes a paid tier live in satoshis (10 per search, 20 per fetch, 1,000 minimum, Lightning) that
  the card still marks alpha. No OpenAPI, documentation site, MCP server or SDK is published; the registrable domain
  digiant.nz redirects to a Web3 name (digiant.crypto) that public DNS does not resolve.
