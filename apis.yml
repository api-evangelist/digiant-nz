apis:
- aid: digiant-nz:a2a-browser-agent
  name: a2a-browser A2A Agent
  description: >-
    Pay-per-search web agent (version 0.1.0-alpha) served from a2a-browser.digiant.nz: a JSON-RPC 2.0 POST endpoint at the
    host root, an A2A agent card at the legacy /.well-known/agent.json path (the canonical agent-card.json is 404), a live
    satoshi price quote at /quote and a JSON health signal at /health. Skills browser/search (SERP query with LLM synthesis,
    "EnrichedResult v3.0") and browser/fetch (Playwright page fetch with entity extraction). Free tier live at 10/hour;
    paid tier not yet open. robots.txt disallows crawlers from /search and /fetch.
  humanURL: https://a2aregistry.org/agents/a2a-browser
